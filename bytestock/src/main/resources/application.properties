spring.application.name=bytestock

# Banco de dados local em arquivo.
# Nao precisa instalar PostgreSQL nem abrir o pgAdmin.
# Os dados ficam salvos em bytestock/data/bytestock.mv.db.
spring.datasource.url=jdbc:h2:file:./data/bytestock
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console opcional para visualizar o banco pelo navegador.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
