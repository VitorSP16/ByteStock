spring.application.name=bytestock

# No Render, estas variaveis apontam para o PostgreSQL.
# Localmente, sem variaveis configuradas, o projeto continua usando H2.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/bytestock}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Usa a porta definida pelo Render e 8080 quando rodar localmente.
server.port=${PORT:8080}
