spring.application.name=bytestock

# Banco de dados local e persistente.
# Nao precisa instalar PostgreSQL nem usar o pgAdmin.
# O H2 cria automaticamente o arquivo data/bytestock.mv.db.
spring.datasource.url=jdbc:h2:file:./data/bytestock
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
