<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ByteStock | Produtos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="brand">Byte<span>Stock</span></div><nav><a th:href="@{/}">⌂ Dashboard</a><a class="active" th:href="@{/produtos}">▣ Produtos</a><a th:href="@{/produtos/novo}">＋ Cadastrar</a></nav></aside>
<main class="content"><header class="topbar"><div><h1>Produtos</h1><p>Gerencie o estoque de hardware</p></div><a class="btn btn-primary" th:href="@{/produtos/novo}">+ Novo produto</a></header>
<div class="panel"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Produto</th><th>Marca</th><th>Categoria</th><th>Qtd.</th><th>Mínimo</th><th>Status</th><th>Ações</th></tr></thead>
<tbody><tr th:each="produto : ${produtos}"><td><strong th:text="${produto.nome}">Produto</strong><small class="d-block text-muted" th:text="${produto.descricao}"></small></td><td th:text="${produto.marca}">Marca</td><td><span class="tag" th:text="${produto.categoria}">Categoria</span></td><td th:text="${produto.quantidade}">0</td><td th:text="${produto.estoqueMinimo}">0</td>
<td><span class="status-ok" th:if="${produto.quantidade > produto.estoqueMinimo}">Normal</span><span class="status-low" th:if="${produto.quantidade <= produto.estoqueMinimo}">Estoque baixo</span></td>
<td class="actions"><a th:href="@{/produtos/editar/{id}(id=${produto.id})}">Editar</a><a th:href="@{/produtos/{id}/entrada(id=${produto.id})}">Entrada</a><a th:href="@{/produtos/{id}/saida(id=${produto.id})}">Saída</a><a th:href="@{/produtos/{id}/historico(id=${produto.id})}">Histórico</a><a class="danger" th:href="@{/produtos/excluir/{id}(id=${produto.id})}" onclick="return confirm('Excluir este produto?')">Excluir</a></td></tr>
<tr th:if="${#lists.isEmpty(produtos)}"><td colspan="7" class="empty">Nenhum produto cadastrado.</td></tr></tbody></table></div></div>
</main></div></body></html>
