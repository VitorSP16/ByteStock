<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="\${produto.id == null ? 'Novo produto' : 'Editar produto'} + ' | ByteStock'">Produto | ByteStock</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body{background:#f4f7fb;color:#111827;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.topbar{background:#fff;border-bottom:1px solid #e5e7eb}.brand{color:#111827;text-decoration:none;font-weight:800;font-size:1.25rem}.brand i{color:#2563eb}
.shell{max-width:980px;margin:auto;padding:34px 16px 55px}.back{color:#64748b;text-decoration:none;font-size:.9rem}.back:hover{color:#2563eb}.cardx{background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 10px 32px rgba(15,23,42,.06);overflow:hidden}
.head{padding:28px 30px 22px;border-bottom:1px solid #e5e7eb}.head h1{font-weight:800;letter-spacing:-.03em}.head p{color:#64748b;margin:0}.bodyx{padding:30px}.section{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#64748b;margin-bottom:18px}
.form-label{font-weight:700;font-size:.92rem}.form-control{min-height:46px;border-radius:11px;border-color:#d1d5db}.form-control:focus{border-color:#2563eb;box-shadow:0 0 0 .2rem rgba(37,99,235,.1)}textarea.form-control{min-height:130px}.help{font-size:.78rem;color:#94a3b8;margin-top:5px}.footer{padding:20px 30px;background:#f8fafc;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:10px}.btn{min-height:44px;border-radius:11px;font-weight:700}.btn-primary{background:#2563eb;border-color:#2563eb}.btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8}.btn-cancel{background:#fff;border:1px solid #d1d5db;color:#374151}.required{color:#dc2626}
@media(max-width:640px){.shell{padding-top:24px}.head,.bodyx,.footer{padding:22px 18px}.footer{flex-direction:column-reverse}.footer .btn{width:100%}}
</style>
</head>
<body>
<nav class="topbar"><div class="container-fluid px-4 py-3 d-flex justify-content-between align-items-center"><a class="brand" href="/produtos"><i class="bi bi-box-seam-fill me-2"></i>ByteStock</a><a class="back" href="/produtos"><i class="bi bi-arrow-left me-1"></i>Voltar para produtos</a></div></nav>
<main class="shell"><div class="mb-3"><a class="back" href="/produtos"><i class="bi bi-chevron-left me-1"></i>Produtos</a></div>
<section class="cardx"><header class="head"><h1 class="h3 mb-1" th:text="\${produto.id == null ? 'Cadastrar produto' : 'Editar produto'}">Cadastrar produto</h1><p th:text="\${produto.id == null ? 'Preencha as informações para adicionar um produto ao estoque.' : 'Atualize as informações do produto selecionado.'}">Preencha as informações para adicionar um produto ao estoque.</p></header>
<form th:action="@{/produtos}" th:object="\${produto}" method="post"><input type="hidden" th:field="*{id}">
<div class="bodyx"><div class="section">Informações do produto</div><div class="row g-4">
<div class="col-12 col-md-7"><label class="form-label" for="nome">Nome <span class="required">*</span></label><input id="nome" class="form-control" type="text" th:field="*{nome}" placeholder="Ex.: Teclado mecânico" maxlength="120" required></div>
<div class="col-12 col-md-5"><label class="form-label" for="marca">Marca</label><input id="marca" class="form-control" type="text" th:field="*{marca}" placeholder="Ex.: HyperX" maxlength="80"></div>
<div class="col-12 col-md-6"><label class="form-label" for="categoria">Categoria <span class="required">*</span></label><input id="categoria" class="form-control" type="text" th:field="*{categoria}" placeholder="Ex.: Periféricos" maxlength="80" required></div>
<div class="col-12 col-md-3"><label class="form-label" for="quantidade">Quantidade <span class="required">*</span></label><input id="quantidade" class="form-control" type="number" th:field="*{quantidade}" min="0" step="1" required><div class="help">Quantidade atual.</div></div>
<div class="col-12 col-md-3"><label class="form-label" for="estoqueMinimo">Estoque mínimo <span class="required">*</span></label><input id="estoqueMinimo" class="form-control" type="number" th:field="*{estoqueMinimo}" min="0" step="1" required></div>
<div class="col-12 col-md-4"><label class="form-label" for="preco">Preço</label><div class="input-group"><span class="input-group-text bg-white">R$</span><input id="preco" class="form-control" type="number" th:field="*{preco}" min="0" step="0.01" placeholder="0,00"></div></div>
<div class="col-12"><label class="form-label" for="descricao">Descrição</label><textarea id="descricao" class="form-control" th:field="*{descricao}" placeholder="Detalhes, especificações ou observações do produto." maxlength="500"></textarea><div class="help">Máximo de 500 caracteres.</div></div>
</div></div>
<footer class="footer"><a class="btn btn-cancel px-4" href="/produtos">Cancelar</a><button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i><span th:text="\${produto.id == null ? 'Cadastrar produto' : 'Salvar alterações'}">Cadastrar produto</span></button></footer>
</form></section></main>
</body></html>
