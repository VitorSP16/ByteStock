<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ByteStock | Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">Byte<span>Stock</span></div>
        <nav>
            <a th:href="@{/}">⌂ Dashboard</a><a th:href="@{/produtos}">▣ Produtos</a>
            <a class="active" th:href="@{/produtos/novo}">＋ Novo produto</a><a th:href="@{/produtos/estoque-baixo}">⚠ Estoque baixo</a>
            <a th:href="@{/movimentacoes}">↕ Movimentações</a><a th:href="@{/relatorios}">▥ Relatórios</a>
        </nav>
    </aside>
    <main class="content narrow">
        <header class="topbar"><div><h1 th:text="${produto.id == null ? 'Cadastrar produto' : 'Editar produto'}">Cadastrar produto</h1><p>Preencha as informações do hardware</p></div></header>
        <form class="panel form-panel" th:action="@{/produtos}" th:object="${produto}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="row g-3">
                <div class="col-md-8"><label>Nome</label><input class="form-control" th:field="*{nome}" required placeholder="Ex.: Memória RAM 16GB"></div>
                <div class="col-md-4"><label>Marca</label><input class="form-control" th:field="*{marca}" placeholder="Ex.: Kingston"></div>
                <div class="col-md-6"><label>Categoria</label><input class="form-control" th:field="*{categoria}" required placeholder="Ex.: Memória"></div>
                <div class="col-md-3">
                    <label th:text="${produto.id == null ? 'Quantidade inicial' : 'Quantidade atual'}">Quantidade</label>
                    <input th:if="${produto.id == null}" type="number" min="0" class="form-control" th:field="*{quantidade}" required>
                    <input th:if="${produto.id != null}" type="number" class="form-control" th:value="${produto.quantidade}" disabled>
                    <small class="form-help" th:if="${produto.id != null}">Use Entrada/Saída para alterar o estoque.</small>
                </div>
                <div class="col-md-3"><label>Estoque mínimo</label><input type="number" min="0" class="form-control" th:field="*{estoqueMinimo}" required></div>
                <div class="col-md-4"><label>Preço unitário</label><input type="number" step="0.01" min="0" class="form-control" th:field="*{preco}" placeholder="0,00"></div>
                <div class="col-12"><label>Descrição</label><textarea class="form-control" rows="4" th:field="*{descricao}" placeholder="Informações adicionais do produto"></textarea></div>
            </div>
            <div class="form-actions"><a class="btn btn-outline-secondary" th:href="@{/produtos}">Cancelar</a><button class="btn btn-primary" type="submit">Salvar produto</button></div>
        </form>
    </main>
</div>
</body>
</html>
