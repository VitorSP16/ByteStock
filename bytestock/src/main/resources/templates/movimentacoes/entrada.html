<!DOCTYPE html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ByteStock | Entrada</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="brand">Byte<span>Stock</span></div><nav><a th:href="@{/}">⌂ Dashboard</a><a th:href="@{/produtos}">▣ Produtos</a></nav></aside><main class="content narrow"><header class="topbar"><div><h1>Entrada de estoque</h1><p>Adicione unidades ao produto</p></div></header>
<div class="panel movement-card"><div class="product-symbol">＋</div><h2 th:text="${produto.nome}">Produto</h2><p><span th:text="${produto.marca}"></span> • <span th:text="${produto.categoria}"></span></p><div class="stock-number"><span>Estoque atual</span><strong th:text="${produto.quantidade}">0</strong></div>
<form th:action="@{/produtos/{id}/entrada(id=${produto.id})}" method="post"><label>Quantidade de entrada</label><input class="form-control form-control-lg" type="number" name="quantidade" min="1" required><div class="form-actions"><a class="btn btn-outline-secondary" th:href="@{/produtos}">Cancelar</a><button class="btn btn-success" type="submit">Registrar entrada</button></div></form></div>
</main></div></body></html>
