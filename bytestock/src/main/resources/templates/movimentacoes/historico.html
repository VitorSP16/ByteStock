<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            ByteStock | Histórico
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <div class="app-shell">
            <aside class="sidebar">
                <div class="brand">
                    Byte
                    <span>
                        Stock
                    </span>
                </div>
                <nav>
                    <a th:href="@{/}">
                        ⌂ Dashboard
                    </a>
                    <a th:href="@{/produtos}">
                        ▣ Produtos
                    </a>
                </nav>
            </aside>
            <main class="content">
                <header class="topbar">
                    <div>
                        <h1>
                            Histórico
                        </h1>
                        <p>
                            Movimentações de
                            <strong th:text="${produto.nome}">
                                Produto
                            </strong>
                        </p>
                    </div>
                    <a class="btn btn-outline-primary" th:href="@{/produtos}">
                        Voltar
                    </a>
                </header>
                <div class="panel">
                    <div class="history-head">
                        <div>
                            <span>
                                Estoque atual
                            </span>
                            <strong th:text="${produto.quantidade}">
                                0
                            </strong>
                        </div>
                        <div>
                            <span>
                                Estoque mínimo
                            </span>
                            <strong th:text="${produto.estoqueMinimo}">
                                0
                            </strong>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>
                                        Tipo
                                    </th>
                                    <th>
                                        Quantidade
                                    </th>
                                    <th>
                                        Data e hora
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="mov : ${movimentacoes}">
                                    <td>
                                        <span th:class="${mov.tipo == 'ENTRADA' ? 'status-ok' : 'status-low'}" th:text="${mov.tipo}">
                                            TIPO
                                        </span>
                                    </td>
                                    <td th:text="${mov.quantidade}">
                                        0
                                    </td>
                                    <td th:text="${mov.data}">
                                        Data
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(movimentacoes)}">
                                    <td colspan="3" class="empty">
                                        Nenhuma movimentação registrada.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
