<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            ByteStock | Saída
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <div class="app-shell">
            <aside class="sidebar">
                <div class="brand">
                    Byte
                    <span>
                        Stock
                    </span>
                </div>
                <nav>
                    <a th:href="@{/}">
                        ⌂ Dashboard
                    </a>
                    <a th:href="@{/produtos}">
                        ▣ Produtos
                    </a>
                </nav>
            </aside>
            <main class="content narrow">
                <header class="topbar">
                    <div>
                        <h1>
                            Saída de estoque
                        </h1>
                        <p>
                            Retire unidades do produto
                        </p>
                    </div>
                </header>
                <div class="panel movement-card">
                    <div class="product-symbol danger-symbol">
                        −
                    </div>
                    <h2 th:text="${produto.nome}">
                        Produto
                    </h2>
                    <p>
                        <span th:text="${produto.marca}">
                        </span>
                        •
                        <span th:text="${produto.categoria}">
                        </span>
                    </p>
                    <div class="stock-number">
                        <span>
                            Estoque disponível
                        </span>
                        <strong th:text="${produto.quantidade}">
                            0
                        </strong>
                    </div>
                    <form th:action="@{/produtos/{id}/saida(id=${produto.id})}" method="post">
                        <label>
                            Quantidade de saída
                        </label>
                        <input class="form-control form-control-lg" type="number" name="quantidade" min="1" th:max="${produto.quantidade}" required>
                        <div class="form-actions">
                            <a class="btn btn-outline-secondary" th:href="@{/produtos}">
                                Cancelar
                            </a>
                            <button class="btn btn-danger" type="submit">
                                Registrar saída
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </body>
</html>
